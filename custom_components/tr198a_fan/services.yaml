pair:
  name: Pair remote
  description: Send the 10× pairing packet so the fan learns this handset ID.
  target:
    entity:
      integration: tr198a_fan
      domain: fan

dim_up:
  name: Dim up
  description: Brighten the light by the configured number of dim steps.
  target:
    entity:
      integration: tr198a_fan
      domain: fan

dim_down:
  name: Dim down
  description: Dim the light by the configured number of dim steps.
  target:
    entity:
      integration: tr198a_fan
      domain: fan

sync_light:
  name: Sync light
  description: Flick the fan's light relay without changing Home Assistant's state (for resync).
  target:
    entity:
      integration: tr198a_fan
      domain: fan
